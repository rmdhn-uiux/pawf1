{% if messages %}
<div class="fixed top-24 right-6 z-[10000] flex flex-col gap-3 max-w-[420px] w-[calc(100%-48px)]" id="toast-container">
    {% for message in messages %}
    <div class="toast-message {% if message.tags %}{{ message.tags }}{% endif %}">
        <div class="flex items-center gap-3">
            {% if 'success' in message.tags %}
                <i class="fa-solid fa-circle-check" style="color: var(--primary); font-size: 1.25rem;"></i>
            {% else %}
                <i class="fa-solid fa-circle-exclamation" style="color: #dc3545; font-size: 1.25rem;"></i>
            {% endif %}
            <span class="toast-text">{{ message }}</span>
        </div>
        <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>
    </div>
    {% endfor %}
</div>
{% endif %}
